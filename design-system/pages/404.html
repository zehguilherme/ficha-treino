<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página não encontrada — Ficha de Treino</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --background: 210 40% 98%;
      --foreground: 222.2 84% 4.9%;
      --card: 0 0% 100%;
      --card-foreground: 222.2 84% 4.9%;
      --primary: 222.2 47.4% 11.2%;
      --primary-foreground: 210 40% 98%;
      --secondary: 210 40% 96.1%;
      --secondary-foreground: 222.2 47.4% 11.2%;
      --muted: 210 40% 96.1%;
      --muted-foreground: 215.4 16.3% 46.9%;
      --accent: 210 40% 96.1%;
      --accent-foreground: 222.2 47.4% 11.2%;
      --border: 214.3 31.8% 91.4%;
      --ring: 222.2 84% 4.9%;
      --radius: 0.5rem;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: hsl(var(--background));
      color: hsl(var(--foreground));
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: hsl(var(--card));
      border-bottom: 1px solid hsl(var(--border));
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .header-inner {
      max-width: 80rem;
      margin: 0 auto;
      padding: 0 1.5rem;
      height: 3.5rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .header-logo {
      width: 2.5rem;
      height: 2.5rem;
      background: hsl(var(--foreground));
      border-radius: 0.375rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .header-logo svg {
      width: 1.25rem;
      height: 1.25rem;
      color: hsl(var(--background));
    }

    .header-title {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
    }

    .card {
      background: hsl(var(--card));
      border: 1px solid hsl(var(--border));
      border-radius: calc(var(--radius) + 0.25rem);
      padding: 3rem 2.5rem;
      text-align: center;
      max-width: 26rem;
      width: 100%;
    }

    .code {
      font-size: 5rem;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.04em;
      color: hsl(var(--foreground));
      margin-bottom: 0.5rem;
    }

    .code-dots {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }

    .code-dot {
      width: 0.5rem;
      height: 0.5rem;
      border-radius: 9999px;
      background: hsl(var(--muted-foreground) / 0.3);
    }

    .message {
      font-size: 1.125rem;
      font-weight: 500;
      line-height: 1.5;
      margin-bottom: 0.75rem;
    }

    .sub-message {
      font-size: 0.875rem;
      color: hsl(var(--muted-foreground));
      line-height: 1.5;
      margin-bottom: 2rem;
    }

    .btn-home {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.875rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      color: hsl(var(--primary-foreground));
      background: hsl(var(--foreground));
      border: none;
      border-radius: var(--radius);
      padding: 0.5rem 1rem;
      cursor: pointer;
      transition: opacity 0.15s;
      text-decoration: none;
    }

    .btn-home:hover {
      opacity: 0.85;
    }

    .btn-home:focus-visible {
      outline: 2px solid hsl(var(--ring));
      outline-offset: 2px;
    }

    .btn-home svg {
      width: 0.875rem;
      height: 0.875rem;
    }

    .footer {
      border-top: 1px solid hsl(var(--border));
      padding: 2rem 1.5rem;
      text-align: center;
      font-size: 0.75rem;
      color: hsl(var(--muted-foreground));
    }

    .footer-brand {
      margin-bottom: 0.25rem;
      color: hsl(var(--foreground));
      font-weight: 500;
    }

    .footer-copy {
      margin-bottom: 1rem;
    }

    .footer-links {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
    }

    .footer-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2rem;
      height: 2rem;
      border: 1px solid hsl(var(--border));
      border-radius: var(--radius);
      color: hsl(var(--muted-foreground));
    }

    .footer-link:hover { background: hsl(var(--secondary)); }
    .footer-link:focus-visible { outline: 2px solid hsl(var(--ring)); outline-offset: 2px; }
    .footer-link svg { width: 1rem; height: 1rem; }

    @media (max-width: 640px) {
      .main { padding: 2rem 1rem; }
      .card { padding: 2rem 1.5rem; }
    }
  </style>
</head>
